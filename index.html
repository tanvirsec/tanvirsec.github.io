<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff0c9">
<title>Maaf, ya, sayang! 🧸</title>
<style>
:root{--ink:#58425f;--muted:#8d7893;--cream:#fffaf0;--yellow:#ffe79a;--pink:#ffc7d7;--blue:#bcecff;--mint:#c7f3df;--lilac:#ded0ff;--orange:#ffd0a8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ink)}
body{min-height:100svh;overflow:hidden;background:linear-gradient(135deg,#fff0c9,#ffdbe7 45%,#d7efff)}
button{font:inherit;cursor:pointer}
.bg-shape{position:fixed;z-index:-2;border-radius:50%;filter:blur(1px);opacity:.8;animation:drift 12s ease-in-out infinite alternate}
.s1{width:230px;height:230px;left:-90px;top:8%;background:var(--yellow)}.s2{width:190px;height:190px;right:-75px;top:18%;background:var(--mint);animation-delay:-4s}.s3{width:260px;height:260px;right:12%;bottom:-180px;background:var(--lilac);animation-delay:-7s}
.top{position:fixed;z-index:10;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:14px 17px;pointer-events:none}
.brand{font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;background:#fff9;padding:9px 12px;border-radius:99px;box-shadow:0 5px 18px #70577b12}
.music{pointer-events:auto;width:42px;height:42px;border:2px solid white;border-radius:50%;background:#fff9;color:#775d87;font-size:17px;box-shadow:0 5px 18px #70577b12}
main{height:100svh;display:flex;align-items:center;justify-content:center;padding:65px 15px 35px}
.deck{width:min(100%,430px);position:relative}
.progress-wrap{display:flex;gap:5px;margin:0 2px 12px}
.progress{height:5px;flex:1;border-radius:20px;background:#ffffff9c;overflow:hidden}
.progress span{display:block;width:0;height:100%;background:#8870a7;border-radius:20px;transition:width .3s}
.progress.done span{width:100%}
.counter{text-align:center;font-size:10px;letter-spacing:.13em;font-weight:900;color:#826c91;margin-bottom:11px}
.card{position:relative;min-height:470px;max-height:calc(100svh - 145px);overflow-y:auto;background:#fffdf5eF;border:3px solid #fff;border-radius:29px;padding:25px 22px 21px;text-align:center;box-shadow:0 22px 70px #6e57752b;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:cardIn .45s cubic-bezier(.2,.8,.2,1) both}
.card:before{content:"";position:absolute;inset:7px;border:1.5px dashed #e5c8ed;border-radius:21px;pointer-events:none}
.sticker{font-size:66px;line-height:1.1;margin:2px 0 13px;filter:drop-shadow(0 7px 4px #8a66831a);animation:bounce 2.4s ease-in-out infinite;position:relative}
.tag{font-size:9px;letter-spacing:.17em;text-transform:uppercase;font-weight:900;color:#a58bb2;margin:0 0 11px;position:relative}
h1{font-size:clamp(29px,8vw,39px);line-height:1.12;letter-spacing:-.04em;margin:0 0 15px;font-weight:900;position:relative}
.message{font-size:15px;line-height:1.7;max-width:310px;color:#806d89;margin:0 auto 19px;position:relative}
.photo{width:min(100%,245px);height:190px;border:7px solid white;border-bottom-width:23px;border-radius:15px;box-shadow:0 8px 25px #82678b22;background:linear-gradient(135deg,#ffe2a7,#ffd5e6,#c9eeff);transform:rotate(-2deg);overflow:hidden;position:relative;margin:4px auto 18px}
.photo:nth-of-type(even){transform:rotate(2deg)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .fallback{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px;color:#826b94;font-size:12px;line-height:1.5}
.photo .fallback b{font-size:34px;font-weight:400}
.btn-row{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;position:relative;margin-top:3px}
.btn{border:0;border-radius:99px;background:#8b76a8;color:white;font-size:12px;font-weight:900;padding:13px 18px;box-shadow:0 6px 0 #6c5886;transition:transform .15s,box-shadow .15s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #6c5886}
.btn.secondary{background:#ffe0eb;color:#8d5e7b;box-shadow:0 6px 0 #e7b8cd}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tiny{font-size:10px;color:#b29eb8;margin-top:17px;position:relative}
.floaties{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}
.floaty{position:absolute;bottom:-40px;animation:floatUp linear forwards;opacity:0}
.modal-bg{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:22px;background:#53405f66;backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:.25s}
.modal-bg.show{opacity:1;visibility:visible}
.modal{width:min(100%,330px);padding:27px 22px 23px;background:#fffdf7;border:4px solid white;border-radius:27px;text-align:center;box-shadow:0 20px 70px #47314e40;transform:scale(.85) rotate(-2deg);transition:.3s}
.modal-bg.show .modal{transform:scale(1) rotate(0)}
.modal .emoji{font-size:54px;animation:bounce 1.8s infinite}
.modal h2{font-size:25px;margin:11px 0;color:#70577e}
.modal p{font-size:13px;line-height:1.7;color:#8e7b97;margin:0 0 18px}
.modal .btn{position:relative}
.toast{position:fixed;z-index:40;bottom:15px;left:50%;transform:translate(-50%,20px);opacity:0;background:#5d4a6c;color:#fff;border-radius:99px;padding:11px 15px;font-size:11px;transition:.3s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes cardIn{from{opacity:0;transform:translateX(22px) scale(.97)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes popCute{0%{opacity:0;transform:scale(.78) rotate(-5deg)}65%{opacity:1;transform:scale(1.035) rotate(2deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes bounceCute{0%{opacity:0;transform:translateY(35px) scale(.9)}65%{opacity:1;transform:translateY(-8px) scale(1.02)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes wiggleCute{0%{opacity:0;transform:rotate(-4deg) scale(.94)}35%{opacity:1;transform:rotate(3deg) scale(1.02)}60%{transform:rotate(-2deg) scale(1)}80%{transform:rotate(1deg)}100%{opacity:1;transform:rotate(0)}}
@keyframes flipCute{0%{opacity:0;transform:perspective(600px) rotateY(-18deg) scale(.94)}100%{opacity:1;transform:perspective(600px) rotateY(0) scale(1)}}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
@keyframes drift{to{transform:translate(25px,-18px) scale(1.08)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) rotate(0)}12%{opacity:.8}100%{opacity:0;transform:translateY(-115vh) rotate(40deg)}}
@media(max-height:680px){.card{min-height:0;max-height:calc(100svh - 130px);padding:20px 18px}.sticker{font-size:48px;margin-bottom:8px}.message{font-size:14px;margin-bottom:12px}.photo{height:145px;width:min(100%,200px)}h1{font-size:30px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

.deck{transition:opacity .7s,transform .7s}.deck.wait{opacity:0;transform:scale(.94)}
.sticker i{display:none;position:absolute;font-style:normal}
.fx-wave i:first-child{display:block;right:-30px;top:-6px;font-size:34px;transform-origin:70% 80%;animation:waveHand 1.1s ease-in-out infinite}.fx-wave i:first-child:before{content:"👋"}
.fx-sorry{animation:bow 3.2s ease-in-out infinite}.fx-sorry i{display:block;font-size:17px;opacity:0;top:58%;animation:tear 2.2s ease-in infinite}.fx-sorry i:before{content:"💧"}.fx-sorry i:nth-child(1){left:20%}.fx-sorry i:nth-child(2){right:20%;animation-delay:1.1s}.fx-sorry i:nth-child(3){display:none}
.fx-listen i,.fx-beat i,.fx-breathe i{display:block;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border:3px solid #d9b8e8;border-radius:50%;opacity:0;z-index:-1;animation:ring 2.4s ease-out infinite}
.fx-listen i:nth-child(2),.fx-beat i:nth-child(2){animation-delay:.8s}.fx-listen i:nth-child(3),.fx-beat i:nth-child(3){animation-delay:1.6s}
.fx-beat{animation:heartbeat 1.4s ease-in-out infinite}.fx-beat i{border-color:#ffb3c8;animation-duration:1.4s}
.fx-breathe{animation:breatheEmo 6s ease-in-out infinite}.fx-breathe i{border-color:#bcecff;animation:breathe 6s ease-in-out infinite}.fx-breathe i:nth-child(n+2){display:none}
.fx-grow{width:76px;height:76px;margin-left:auto;margin-right:auto;animation:none}.fx-grow span{position:absolute;left:0;right:0;bottom:0;transform-origin:50% 100%}.g1{animation:sprout 4.5s ease-in-out infinite}.g2{animation:bloom 4.5s ease-in-out infinite}
.fx-hug{width:150px;height:76px;margin-left:auto;margin-right:auto;animation:none}.fx-hug span{position:absolute;bottom:0}.h1{left:0;animation:hugL 3.6s ease-in-out infinite}.h2{right:0;animation:hugR 3.6s ease-in-out infinite}.fx-hug i{display:block;left:50%;top:-4px;margin-left:-12px;font-size:26px;opacity:0;animation:hugHeart 3.6s ease-in-out infinite}
.w{display:inline-block;animation:wordIn .5s calc(.3s + var(--i)*.05s) both}
h1{animation:wordIn .6s .1s both}h1:after{content:"";display:block;height:6px;width:0;margin:7px auto 0;border-radius:9px;background:linear-gradient(90deg,var(--pink),var(--yellow));animation:underline .8s .6s forwards}
.polwrap{position:relative;width:min(100%,245px);margin:6px auto 18px;transform-origin:50% 0;animation:swing 4.5s ease-in-out infinite}.polwrap .photo{width:100%;margin:0}
.polwrap:before{content:"";position:absolute;top:-10px;left:50%;width:72px;height:22px;margin-left:-36px;background:repeating-linear-gradient(45deg,#ffd6e6e6 0 6px,#fff0f6e6 6px 12px);transform:rotate(-4deg);z-index:2;box-shadow:0 2px 5px #7a5a8a22}
#nextBtn{animation:nudge 3s 4s ease-in-out infinite}
.music.on{background:var(--pink);animation:spin 5s linear infinite}
.peek{position:fixed;left:14px;bottom:-6px;font-size:44px;z-index:5;pointer-events:none;transform:translateY(80%);animation:peek 8s ease-in-out infinite}.peek span{position:absolute;right:-12px;top:-4px;font-size:16px;color:#e58ab0}
.pw{position:relative;margin-bottom:12px;padding-top:15px}.pw .progress-wrap{margin:0 2px}.walker{position:absolute;top:-3px;left:0;font-size:17px;transition:left .8s cubic-bezier(.3,1.4,.5,1)}.goal{position:absolute;right:-4px;top:-3px;font-size:16px;animation:heartbeat 1.4s infinite}
.spark{position:fixed;z-index:60;pointer-events:none;color:#e58ab0;font-size:15px;animation:spark .9s ease-out forwards}
.intro{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:22px;background:#fff0c9ee;background:linear-gradient(135deg,#fff0c9f2,#ffdbe7f2 50%,#d7efffee);transition:opacity .7s,visibility .7s}.intro.gone{opacity:0;visibility:hidden}
.intro-card{text-align:center;max-width:330px}.intro h2{font-size:26px;line-height:1.25;margin:4px 0 8px;letter-spacing:-.03em}.intro p{margin:0 0 22px;color:var(--muted);font-size:13px}
.dots b{display:inline-block;animation:dotb 1.2s infinite}.dots b:nth-child(2){animation-delay:.2s}.dots b:nth-child(3){animation-delay:.4s}
.env{position:relative;width:160px;height:108px;margin:10px auto 26px;animation:envFloat 2.6s ease-in-out infinite}.env>*{position:absolute}
.env-back{inset:0;background:#ffb3cb;border-radius:10px;box-shadow:0 12px 28px #8a5c7440}
.letter{left:14px;right:14px;top:8px;height:86px;background:#fffdf3;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:28px;transition:transform .9s .35s cubic-bezier(.3,1.4,.5,1);z-index:2}
.env-front{inset:0;border-radius:10px;z-index:3;background:linear-gradient(135deg,transparent 49%,#ff9fbd 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 49%,#ffa9c3 50%) right/50% 100% no-repeat}
.flap{left:0;right:0;top:0;height:60px;background:#ff8fb1;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s;z-index:4}
.seal{left:50%;top:38px;margin-left:-14px;font-size:26px;z-index:5;animation:heartbeat 1.2s infinite;transition:opacity .3s}
.intro.open .flap{transform:rotateX(180deg);z-index:1}.intro.open .letter{transform:translateY(-70px)}.intro.open .seal{opacity:0}.intro.open .env{animation:none}
@keyframes waveHand{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(24deg)}}
@keyframes bow{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(-9deg) translateY(4px)}}
@keyframes tear{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(34px)}}
@keyframes ring{0%{opacity:.8;transform:scale(.5)}100%{opacity:0;transform:scale(2.3)}}
@keyframes heartbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
@keyframes breatheEmo{0%,100%{transform:scale(.92)}50%{transform:scale(1.12)}}
@keyframes breathe{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:.7;transform:scale(1.6)}}
@keyframes sprout{0%{opacity:1;transform:scale(.3)}40%{opacity:1;transform:scale(1)}55%,100%{opacity:0;transform:scale(1.1)}}
@keyframes bloom{0%,45%{opacity:0;transform:scale(.2)}62%{opacity:1;transform:scale(1.2)}72%,90%{opacity:1;transform:scale(1)}100%{opacity:0}}
@keyframes hugL{0%{opacity:0;transform:translateX(-34px)}25%{opacity:1;transform:translateX(-6px)}55%,85%{opacity:1;transform:translateX(34px) rotate(8deg)}100%{opacity:0;transform:translateX(34px)}}
@keyframes hugR{0%{opacity:0;transform:translateX(34px)}25%{opacity:1;transform:translateX(6px)}55%,85%{opacity:1;transform:translateX(-34px) rotate(-8deg)}100%{opacity:0;transform:translateX(-34px)}}
@keyframes hugHeart{0%,50%{opacity:0;transform:translateY(10px) scale(.4)}65%{opacity:1;transform:translateY(-8px) scale(1.2)}90%,100%{opacity:0;transform:translateY(-26px)}}
@keyframes wordIn{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
@keyframes underline{to{width:72px}}
@keyframes swing{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes nudge{0%,90%,100%{transform:none}93%{transform:translateY(-4px) rotate(-2deg)}96%{transform:translateY(-4px) rotate(2deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes peek{0%,58%,100%{transform:translateY(80%)}66%,86%{transform:translateY(6%)}}
@keyframes spark{from{opacity:1;transform:translate(-50%,-50%) scale(.5)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3)}}
@keyframes envFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
@keyframes dotb{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}
@media(max-height:680px){.polwrap{width:min(100%,200px)}.peek{display:none}}
@media(prefers-reduced-motion:reduce){.w{animation-delay:0s!important}}
</style>
</head>
<body>
<div class="bg-shape s1"></div><div class="bg-shape s2"></div><div class="bg-shape s3"></div>
<div class="floaties" id="floaties"></div>
<header class="top"><div class="brand">💌 surat mini untuk kamu</div><button class="music" id="musicBtn" aria-label="Putar atau jeda musik">♫</button></header>
<audio id="musik" src="musik.mp3" loop preload="none"></audio>
<main><div class="deck wait" id="deck">
  <div class="pw"><div class="progress-wrap" id="progress"></div><span class="walker" id="walker">🐻</span><span class="goal">💗</span></div>
  <article class="card" id="card" aria-live="polite"></article>
</div></main>
<div class="modal-bg" id="modalBg" role="dialog" aria-modal="true">
  <div class="modal"><div class="emoji" id="modalEmoji">🥺💗</div><h2 id="modalTitle">Bentar ya…</h2><p id="modalText">Ada yang mau disampaikan.</p><button class="btn" id="modalOk">Oke, lanjut ♡</button></div>
</div>
<div class="peek" aria-hidden="true">🐻<span>♡</span></div>
<div class="intro" id="intro"><div class="intro-card">
<div class="env"><div class="env-back"></div><div class="letter">💗</div><div class="env-front"></div><div class="flap"></div><div class="seal">💗</div></div>
<h2>aku ada pesan buat kamu nih<span class="dots"><b>.</b><b>.</b><b>.</b></span></h2><p>dibaca pelan-pelan, ya 🧸</p>
<button class="btn" id="readBtn">baca ya ♡</button></div></div>
<div class="toast" id="toast">Taruh musik.mp3 di folder yang sama, ya!</div>
<script>
const slides=[
 {tag:"hal kecil dari aku",emoji:"🐻",fx:"wave",title:"Hai, sayang…",text:"Aku punya sedikit kata yang ingin kusampaikan. Boleh temanin aku bentar?",photo:"foto 1.jpg",caption:"buat kamu ♡",button:"Boleh, cerita ♡",next:1},
 {tag:"aku mau jujur",emoji:"🥺",fx:"sorry",title:"Aku minta maaf, ya.",text:"Aku sadar sikapku kemarin bikin kamu sedih. Seharusnya aku lebih menjaga perasaanmu.",button:"Lanjut…",next:2},
 {tag:"tanpa alasan",emoji:"🐣",fx:"listen",title:"Aku nggak mau membela diri.",text:"Perasaanmu valid. Aku mau belajar mendengar, bukan sibuk mencari alasan.",button:"Aku dengar…",next:3},
 {tag:"kenangan kecil #1",emoji:"📸🐰",title:"Ingat foto ini?",text:"Satu momen kecil yang masih kusimpan baik-baik.",photo:"foto 2.jpg",caption:"kenangan kita ♡",button:"Lihat satu lagi",next:4},
 {tag:"kenangan kecil #2",emoji:"🧸✨",title:"Yang ini juga…",text:"Hal sederhana bersamamu sering jadi hal yang paling aku rindukan.",photo:"foto 3.jpg",caption:"masih berarti buatku",button:"Lanjut ya…",next:5},
 {tag:"aku masih belajar",emoji:"🌱",alt:"🌷",fx:"grow",title:"Aku mau berubah.",text:"Bukan cuma bilang sayang, tapi belajar menunjukkannya lewat sikap.",button:"Terus…",next:6},
 {tag:"nggak harus sekarang",emoji:"🐱",fx:"breathe",title:"Kamu boleh ambil waktu.",text:"Aku nggak akan memaksamu langsung memaafkan. Hatimu juga perlu ruang.",button:"Satu lagi",next:7},
 {tag:"dari hati kecilku",emoji:"🫶",fx:"beat",title:"Aku sayang kamu.",text:"Maafku sederhana, tapi aku ingin memperbaiki kesalahanku dengan sungguh-sungguh.",button:"Pesan terakhir ♡",next:8},
 {tag:"pelan-pelan saja",emoji:"🐻",alt:"🐰",fx:"hug",title:"Maaf, ya, sayang.",text:"Kalau kamu sudah siap, aku ingin mendengarkanmu. Nggak harus sekarang. Terima kasih sudah membaca. ♡",button:"Peluk jauh 🫂",modal:true}
];
let current=0;
function stickerHTML(s){const f=s.fx||'',e=s.emoji;
 if(f==='grow')return `<div class="sticker fx-grow"><span class="g1">${e}</span><span class="g2">${s.alt}</span></div>`;
 if(f==='hug')return `<div class="sticker fx-hug"><span class="h1">${e}</span><span class="h2">${s.alt}</span><i>💗</i></div>`;
 return `<div class="sticker fx-${f}">${e}<i></i><i></i><i></i></div>`}
const words=t=>t.split(' ').map((w,i)=>`<span class="w" style="--i:${i}">${w}</span>`).join(' ');
const card=document.querySelector('#card'), progress=document.querySelector('#progress');
function render(){
 const s=slides[current];
 const cuteAnimations=['popCute .55s cubic-bezier(.2,.8,.2,1) both','bounceCute .6s cubic-bezier(.2,.8,.2,1) both','wiggleCute .58s ease-out both','flipCute .5s ease-out both'];
 progress.innerHTML=slides.map((_,i)=>`<div class="progress ${i<=current?'done':''}"><span></span></div>`).join('');
 let photo='';
 if(s.photo){
   photo=`<div class="polwrap"><div class="photo"><img src="${s.photo}" alt="${s.caption}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="fallback" style="display:none"><b>📷💗</b>Taruh file <strong>${s.photo}</strong><br>di folder HTML ini</div></div></div><div class="tiny">${s.caption}</div>`;
 }
 document.querySelector('#walker').style.left=`calc(${current/(slides.length-1)*100}% - ${current/(slides.length-1)*20}px)`;
 card.style.animation=cuteAnimations[current%cuteAnimations.length];
 card.innerHTML=`${stickerHTML(s)}<div class="tag">${s.tag}</div><h1>${s.title}</h1><p class="message">${words(s.text)}</p>${photo}<div class="btn-row"><button class="btn" id="nextBtn">${s.button}</button></div><div class="tiny">♡ pesan ini cuma buat kamu♡</div>`;
 document.querySelector('#nextBtn').addEventListener('click',()=>{
   if(s.modal){makeSprinkles(40);showModal('💌','Makasih sudah baca sampai akhir','Kamu nggak harus menjawab sekarang. Semoga hatimu merasa sedikit lebih hangat. ♡','Selesai ♡');return}
   current=s.next;render();makeSprinkles(12);
 });
}
function showModal(emoji,title,text,button){document.querySelector('#modalEmoji').textContent=emoji;document.querySelector('#modalTitle').textContent=title;document.querySelector('#modalText').textContent=text;document.querySelector('#modalOk').textContent=button;document.querySelector('#modalBg').classList.add('show')}
document.querySelector('#modalOk').addEventListener('click',()=>document.querySelector('#modalBg').classList.remove('show'));
document.querySelector('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')e.currentTarget.classList.remove('show')});
const musik=document.querySelector('#musik'),musicBtn=document.querySelector('#musicBtn');
musicBtn.addEventListener('click',async()=>{if(musik.paused){try{await musik.play()}catch(e){showToast('Letakkan file musik.mp3 di folder yang sama, ya!')}}else{musik.pause()}});
musik.addEventListener('play',()=>musicBtn.classList.add('on'));musik.addEventListener('pause',()=>musicBtn.classList.remove('on'));
let toastTimer;function showToast(msg){const t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3000)}
function makeSprinkles(n=1){const chars=['♡','✦','🌸','💗','✿','✨','♪'];for(let i=0;i<n;i++){const e=document.createElement('span');e.className='floaty';e.textContent=chars[Math.floor(Math.random()*chars.length)];e.style.left=Math.random()*100+'%';e.style.fontSize=(15+Math.random()*14)+'px';e.style.animationDuration=(5+Math.random()*4)+'s';document.querySelector('#floaties').appendChild(e);setTimeout(()=>e.remove(),10000)}}
setInterval(()=>makeSprinkles(1),1300);
document.addEventListener('pointerdown',e=>{if(e.target.closest('#intro'))return;for(let i=0;i<5;i++){const s=document.createElement('span');s.className='spark';s.textContent=['♡','✦','✿'][i%3];s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';s.style.setProperty('--dx',(Math.random()*90-45)+'px');s.style.setProperty('--dy',(-30-Math.random()*55)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),900)}});
document.querySelector('#readBtn').addEventListener('click',()=>{
 const intro=document.querySelector('#intro');intro.classList.add('open');
 musik.volume=0;musik.play().then(()=>{let v=0;const f=setInterval(()=>{v=Math.min(.7,v+.035);musik.volume=v;if(v>=.7)clearInterval(f)},200)}).catch(()=>showToast('Letakkan file musik.mp3 di folder yang sama, ya!'));
 makeSprinkles(24);
 setTimeout(()=>{intro.classList.add('gone');render();document.querySelector('#deck').classList.remove('wait')},1500);
});
</script>
</body>
</html>
