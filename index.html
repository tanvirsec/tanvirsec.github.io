<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Kepulan Asap di Atas Tanah Kami</title>
<style>
:root{--bg:#0b0b10;--fg:#f3efe8;--ac:#ff8a3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
#app{position:relative;height:100%;overflow:hidden;transition:background 1s}
canvas{position:absolute;inset:0;width:100%;height:100%}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:12px}
#chip{position:absolute;top:12px;left:12px;right:12px;font:12px system-ui,sans-serif;opacity:.8}
#cast{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin-bottom:14px}
.f{flex:0 1 64px;text-align:center;opacity:.5;transition:transform .9s,opacity .4s;transform-origin:50% 100%;animation:in .8s}
.f svg{width:100%;max-width:44px;display:block;margin:0 auto}
.f .pr{height:22px;font-size:18px}.f .nm{font:10px system-ui,sans-serif;margin-top:2px}
.f.on{opacity:1;filter:drop-shadow(0 0 8px var(--ac))}.f.on svg{animation:bob .6s infinite alternate}
.f.cough svg{animation:sh .12s infinite}.f.fall{transform:rotate(82deg) translate(-4px,18px);opacity:.8}
.sm .f{flex-basis:30px}.sm .nm{display:none}.sm .pr{height:16px;font-size:12px}
@keyframes bob{to{transform:translateY(-5px)}}@keyframes sh{50%{transform:translateX(3px) rotate(2deg)}}@keyframes in{from{opacity:0;transform:translateY(20px)}}
#cap{min-height:104px;background:rgba(0,0,0,.55);border-radius:14px;padding:12px 14px;line-height:1.45;font-size:16px;backdrop-filter:blur(4px)}
#cap b{display:block;color:var(--ac);font:600 13px system-ui,sans-serif;margin-bottom:4px}
#cap.n{font-style:italic;color:#cfc8bb;font-size:14px}#cap.p{font-size:18px;text-align:center}
#ctl{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:10px;font-family:system-ui,sans-serif}
button{background:#ffffff1f;color:var(--fg);border:0;border-radius:20px;padding:9px 16px;font-size:15px}
#dots{display:flex;gap:6px}#dots i{width:8px;height:8px;border-radius:4px;background:#fff4}#dots i.a{background:var(--ac)}
#card,#black{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity 1s;padding:20px}
#card{pointer-events:none;opacity:0;background:#000a}#card h1{font-size:30px;margin:0;color:var(--ac)}#card p{margin:8px 0 0;font-size:18px}
#black{background:#000;opacity:1;gap:14px}#black h2{margin:0;font-size:26px}#black small{opacity:.7}
</style></head><body><div id="app"><canvas id="cv"></canvas>
<div id="ui"><div id="chip"></div><div id="cast"></div><div id="cap" class="n"></div>
<div id="ctl"><button id="pv">⏮</button><button id="pp">⏸</button><button id="nx">⏭</button><button id="mu">🔊</button><div id="dots"></div></div></div>
<div id="card"><h1></h1><p></p></div>
<div id="black"><h2>Kepulan Asap di Atas Tanah Kami</h2><small>Drama ~5 menit · 11 pemeran</small><button id="go">▶ Mulai</button></div></div>
<script>
const W1='#b08968',W2='#8d99ae',W3='#9a8c98',FR='#d1495b',FL='#edae49',PD='#e07a5f',PG='#81b29a';
const poem=["Lihatlah...","Ketika jemari serakah menyulut segumpal api,","Bukan hanya pepohonan yang menjadi abu,","Tapi juga napas anak-anak kecil yang tak berdosa.","Di mana nurani, saat pahlawan pemadam harus tumbang bersimbah asap?","Di mana keadilan, saat roda ekonomi rakyat kecil terhenti tak berdaya?","Hutan bukan sekadar kayu dan daun,","Hutan adalah napas kita, rumah kita, masa depan anak cucu kita!","Cukup sudah langit kami dihiasi duka!","Hentikan pembakaran, jaga bumi sebelum bumi membalas kita!"];
const S=[
{t:'BABAK 1',s:'Mancing Emosi (Awal Yang Kelam)',bg:['#2a1717','#0b0707'],sm:.6,fi:0,m:'🎵 Backsound sedih / melankolis',mu:'sad',sf:'siren',c:[['Warga 1',W1],['Warga 2',W2],['Warga 3',W3]],L:[
[-1,'Panggung remang-remang. Lampu fokus merah tipis dan asap tipis melintas.'],
[0,'Tuhan... sampai kapan langit kita akan pekat seperti ini? Anakku... bernapaslah, Nak...','cough'],
[1,'Ibu... dadaku sesak sekali... Gelap, Bu... aku tidak bisa lihat matahari...','cough'],
[2,'Mana keadilan?! Rumah kami tenggelam dalam asap! Siapa yang tega melakukan semua ini?!','cough'],
[-1,'Semua warga mematung dengan ekspresi penderitaan.']]},
{t:'BABAK 2',s:'Kejahatan & Keserakahan',bg:['#3a2b10','#0d0905'],sm:.5,fi:0,m:'🔊 Suara kobaran api',mu:'low',c:[['Pelaku',FR,'🔥']],L:[
[-1,'Lampu berubah agak terang kuning kelam. Warga bergerak mundur ke area gelap. Pelaku masuk memegang obor dan botol bensin, tersenyum sinis.'],
[0,'Haha! Hutan ini terlalu luas kalau cuma didiamkan. Satu lemparan api, ratusan hektar tanah akan bersih! Proyek besar akan masuk, dan kantongku akan penuh uang!'],
[0,'Bakar! Biar semuanya jadi abu!'],
[-1,'SFX: Suara kobaran api membesar bergemuruh! Lampu berkedip merah terang.','boom']]},
{t:'BABAK 3',s:'Perjuangan Pemadam Kebakaran',bg:['#3b0f0f','#120404'],sm:.8,fi:.9,m:'🎵 Musik tegang / drum cinematic',mu:'tense',c:[['Komandan',FL,'🧯'],['Pemadam 1',PD,'💦'],['Pemadam 2',PG,'💦']],L:[
[-1,'Komandan, Pemadam 1, dan Pemadam 2 masuk membawa selang.'],
[0,'Api makin tidak terkendali! Tim, siram sisi barat! Jangan biarkan masuk ke pemukiman warga!'],
[2,'Asapnya terlalu tebal, Komandan! Pandangan terbatas!','cough'],
[1,'Saya... saya masih bisa lanjut... demi warga...!','cough'],
[0,'Tahan! Bertahanlah!'],
[-1,'Pemadam 1 tergeletak tumbang ke tanah akibat kehabisan oksigen dan kelelahan.','fall',1],
[2,'Rekan kita tumbang! Bertahanlah, kawan! Buka maskernya!','cough'],
[0,'Pantang pulang sebelum padam! Semprotkan semuanya sekarang! Buka katup utama!'],
[-1,'SFX: Suara semprotan air kencang dan desis api padam pffftttt. Lampu merah perlahan redup. Pemadam 2 memapah Pemadam 1 yang pingsan ke luar lapangan.','out']]},
{t:'BABAK 4',s:'Dampak Nyata (Lumpuhnya UMKM & Kehidupan)',bg:['#1c1c22','#08080a'],sm:.4,fi:0,m:'🎵 Backsound sedih',mu:'sad',c:[['Pedagang 1',PD,'🛒'],['Pedagang 2',W2,'🌾']],L:[
[-1,'Lampu sorot ke sisi kanan panggung. Pedagang 1 dan Pedagang 2 berjalan lesu membawa barang dagangan yang rusak/kosong.'],
[0,'Bulan ini toko harus tutup lagi... Tidak ada pembeli yang berani keluar rumah karena asap. Warungku kecil... modal habis, utang menumpuk...'],
[1,'Hasil panen busuk tertutup debu abu... Usaha UMKM kami mati total. Bagaimana kami harus memberi makan anak dan istri besok?','fall']]},
{t:'BABAK 5',s:'Orasi & Penutup (Pesan Moral)',bg:['#2a2a3a','#0b0b12'],sm:.15,fi:0,m:'🎵 Instrumen puisi melankolis tapi menggugah',mu:'poem',sm2:1,c:[['Narator','#f4f1de','🎤'],['Pelaku',FR],['Warga 1',W1],['Warga 2',W2],['Warga 3',W3],['Komandan',FL],['Pemadam 1',PD],['Pemadam 2',PG],['Pedagang 1',PD],['Pedagang 2',W2],['Pemain',PG]],L:[
[-1,'Seluruh pemain maju ke panggung, berdiri berjejer dengan wajah penuh penyesalan dan harapan. Lampu terang penuh.'],
[-1,'Narator maju ke tengah panggung memegang mikrofon.'],
...poem.map(p=>[0,p,'',0,1]),
[-1,'Semua pemain menundukkan kepala, lalu perlahan melangkah maju bersama-sama.'],
[-2,'"Selamatkan Hutan Kami! Selamatkan Masa Depan Kami!"'],
[-1,'Lampu panggung perlahan blackout / padam total.']]}];
let AC,master,muted=false,mi,ai,curMu='',ci=0;
function aInit(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination);ai=setInterval(()=>{if(typeof fi!=='undefined'&&fi>.3&&Math.random()<fi*.8)nz(.04,2500+Math.random()*2500,'bandpass',.12+Math.random()*.1)},110)}
function tone(f,d,ty,v,lp){const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type=ty;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=lp||1800;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+d*.3);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(fl);fl.connect(g);g.connect(master);o.start(t);o.stop(t+d+.1)}
function nz(d,fr,ty,v,sw){const t=AC.currentTime,n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;fl.type=ty;fl.frequency.setValueAtTime(fr,t);if(sw)fl.frequency.exponentialRampToValueAtTime(sw,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(master);s.start(t)}
function kick(v){const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+.25);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g);g.connect(master);o.start(t);o.stop(t+.35)}
const AM=[[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]];
function setMusic(m){if(!AC||m===curMu)return;curMu=m;clearInterval(mi);if(!m)return;let n=0;
const step={sad:()=>{const c=AM[ci%4];tone(c[n%3]*(n%2?1:2),2.4,'triangle',.12,1400);if(n%3==0){tone(c[0]/2,3.2,'sine',.14);ci++}n++},
low:()=>{tone(55,2.5,'sawtooth',.1,300);if(n++%2)kick(.3)},
tense:()=>{kick(.5);if(n++%2)nz(.15,3000,'highpass',.12);if(n%4==1)tone(55,1.6,'sawtooth',.12,400)},
poem:()=>{const c=AM[ci++%4];c.forEach(f=>tone(f,3.4,'sawtooth',.045,900));tone(c[0]/2,3.4,'sine',.1)}}[m];
step();mi=setInterval(step,{sad:1700,low:1200,tense:450,poem:2800}[m])}
function sfx(k){if(!AC)return;({cough:()=>[0,220,450].forEach(d=>setTimeout(()=>nz(.12,600,'bandpass',.5),d)),
siren:()=>[0,1200].forEach(d=>setTimeout(()=>{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(650,t);o.frequency.linearRampToValueAtTime(950,t+.6);o.frequency.linearRampToValueAtTime(650,t+1.2);g.gain.value=.05;o.connect(g);g.connect(master);o.start(t);o.stop(t+1.2)},d)),
boom:()=>{kick(.9);nz(1.8,400,'lowpass',.7,60)},spray:()=>nz(3,1500,'highpass',.5,4000),thud:()=>kick(.8)})[k]?.()}
const VP={'Narator':[.9,.85],'Pelaku':[.5,.95],'Warga 1':[1.3,.9],'Warga 2':[1.7,.95],'Warga 3':[1,1.05],'Komandan':[.7,1],'Pemadam 1':[.9,1],'Pemadam 2':[1.1,1.05],'Pedagang 1':[.8,.9],'Pedagang 2':[1.1,.9]};
function speak(txt,name,loud){const o={d:false};if(muted||!window.speechSynthesis){o.d=true;return o}
const u=new SpeechSynthesisUtterance(txt.split('...').join(', ').split(String.fromCharCode(34)).join(''));u.lang='id-ID';const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.toLowerCase().split('_').join('-').startsWith('id'));if(v)u.voice=v;
const p=VP[name]||[1,.95];u.pitch=p[0];u.rate=loud?.9:p[1];u.onend=u.onerror=()=>{o.d=true};speechSynthesis.speak(u);return o}
const $=s=>document.querySelector(s),cv=$('#cv'),cx=cv.getContext('2d');
let w,h,smT=0,fiT=0,sm=0,fi=0,tok=0,paused=false,cur=0;const P=[];
function rs(){w=cv.width=innerWidth;h=cv.height=innerHeight}rs();addEventListener('resize',rs);
(function loop(){cx.globalCompositeOperation='source-over';cx.clearRect(0,0,w,h);sm+=(smT-sm)*.03;fi+=(fiT-fi)*.03;
if(Math.random()<sm*.7)P.push({k:0,x:Math.random()*w,y:h*.85,r:25+Math.random()*35,vy:-.5-Math.random()*.5,vx:(Math.random()-.5)*.6,l:0,L:260});
if(Math.random()<fi*1.6)P.push({k:1,x:Math.random()*w,y:h,r:12+Math.random()*20,vy:-1.6-Math.random()*2.2,vx:(Math.random()-.5)*.8,l:0,L:75});
for(let i=P.length-1;i>=0;i--){const p=P[i];p.l++;p.x+=p.vx;p.y+=p.vy;if(p.l>p.L){P.splice(i,1);continue}
const a=Math.sin(Math.PI*p.l/p.L);cx.globalCompositeOperation=p.k?'lighter':'source-over';
cx.fillStyle=p.k?`rgba(255,${90+p.l*2},30,${a*.35})`:`rgba(130,125,120,${a*.17})`;cx.beginPath();cx.arc(p.x,p.y,p.r*(p.k?1-p.l/p.L*.6:1+p.l/p.L),0,7);cx.fill()}
requestAnimationFrame(loop)})();
const sleep=async(ms,t)=>{let e=0;while(e<ms){await new Promise(r=>setTimeout(r,50));if(t!==tok)throw 0;if(!paused)e+=50}};
const fig=(i,[n,c,pr])=>`<div class="f" id="f${i}"><div class="pr">${pr||''}</div><svg viewBox="0 0 40 80"><circle cx="20" cy="12" r="10" fill="#e8c3a0"/><rect x="7" y="24" width="26" height="36" rx="11" fill="${c}"/><rect x="10" y="56" width="8" height="22" rx="4" fill="#2b2b33"/><rect x="22" y="56" width="8" height="22" rx="4" fill="#2b2b33"/></svg><div class="nm">${n}</div></div>`;
$('#dots').innerHTML=S.map(()=>'<i></i>').join('');
const F=i=>$('#f'+i),all=()=>document.querySelectorAll('.f');
async function scene(i,t){cur=i;const s=S[i];document.querySelectorAll('#dots i').forEach((d,k)=>d.classList.toggle('a',k==i));
$('#black').style.opacity=0;$('#app').style.background=`linear-gradient(${s.bg[0]},${s.bg[1]})`;smT=s.sm;fiT=s.fi;setMusic(s.mu||'');if(s.sf)sfx(s.sf);$('#chip').textContent=s.m;
$('#cast').className=s.c.length>6?'sm':'';$('#cast').innerHTML='';$('#cap').innerHTML='';
$('#card h1').textContent=s.t;$('#card p').textContent=s.s;$('#card').style.opacity=1;await sleep(2200,t);$('#card').style.opacity=0;
$('#cast').innerHTML=s.c.map((c,k)=>fig(k,c)).join('');await sleep(700,t);
for(const [who,txt,act,tg,poemL] of s.L){const cap=$('#cap');cap.className=who==-1?'n':poemL?'p':'';
all().forEach(f=>f.classList.remove('on','cough'));
const tgt=tg!==undefined?tg:who;
if(who>=0)F(who)?.classList.add('on');if(who==-2)all().forEach(f=>f.classList.add('on'));
if(act=='cough'&&F(who))F(who).classList.add('cough');
if(act=='fall'&&F(tgt))F(tgt).classList.add('fall');
if(act=='boom'){fiT=1;smT=1;sfx('boom')}if(act=='out'){fiT=0;smT=.5;sfx('spray')}if(act=='cough')sfx('cough');if(act=='fall')sfx('thud');
const head=who>=0?`<b>${s.c[who][0]}</b>`:who==-2?'<b>Seluruh Pemain</b>':'';
const o=who==-1?{d:true}:speak(txt,who>=0?s.c[who][0]:'',who==-2);const sp=who==-1?3:1;
for(let k=sp;k<=txt.length+sp;k+=sp){cap.innerHTML=head+txt.slice(0,k);await sleep(50,t)}
let w8=0;while(!o.d&&w8<400){await sleep(50,t);w8++}
await sleep(who==-1?1800:(muted?1200:poemL?500:400),t)}
all().forEach(f=>f.classList.remove('on','cough'))}
async function play(si){const t=++tok;paused=false;speechSynthesis.cancel();aInit();AC.resume();$('#pp').textContent='⏸';try{for(let i=si;i<S.length;i++)await scene(i,t);
smT=0;fiT=0;setMusic('');$('#black').innerHTML='<h2>— SELESAI —</h2><small>Selamatkan hutan kami.</small><button id="go">↺ Putar ulang</button>';$('#black').style.opacity=1;$('#go').onclick=()=>play(0)}catch(e){}}
$('#go').onclick=()=>{aInit();AC.resume();speechSynthesis.speak(new SpeechSynthesisUtterance(' '));play(0)};
$('#pp').onclick=()=>{paused=!paused;$('#pp').textContent=paused?'▶':'⏸';if(paused){speechSynthesis.pause();AC&&AC.suspend()}else{speechSynthesis.resume();AC&&AC.resume()}};$('#mu').onclick=()=>{muted=!muted;$('#mu').textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:.5;if(muted)speechSynthesis.cancel()};
$('#nx').onclick=()=>play(Math.min(cur+1,S.length-1));$('#pv').onclick=()=>play(Math.max(cur-1,0));
</script></body></html>
